name: Generate Pacman Animation

on:
  schedule:
    - cron: "0 0 * * *" # Roda todos os dias à meia-noite
  workflow_dispatch: # Permite rodar manualmente num botão

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # Gera o SVG do Pac-Man usando a Action
      - name: Generate Pacman
        uses: AndreRuperto/svg-pacman-contributions@v2.1
        with:
          github_user_name: SnuflyNoctis
          github_token: ${{ secrets.METRICS_TOKEN }}
          
      # Faz o push do SVG gerado de volta para o teu repositório
      - name: Push to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add github-contribution-grid-snake.svg
          git commit -m "🎮 Update Pac-Man Contribution Graph" || exit 0
          git push
