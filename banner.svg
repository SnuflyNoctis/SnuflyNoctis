<svg fill="none" viewBox="0 0 900 300" width="900" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Puxando a sua imagem em Full HD salva no seu repositório -->
  <image href="https://raw.githubusercontent.com/SnuflyNoctis/SnuflyNoctis/main/118133.jpg" x="0" y="0" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" />
  
  <!-- Película escura suave para o vitral brilhar, mas o texto ficar legível -->
  <rect width="100%" height="100%" fill="black" fill-opacity="0.3" />
  
  <!-- Sombra do texto -->
  <text x="50.2%" y="50.5%" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="54" font-weight="bold" fill="#000000">
    Hi, I'm João Victor!
  </text>
  
  <!-- Texto principal -->
  <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="54" font-weight="bold" fill="#ffffff">
    Hi, I'm João Victor!
  </text>
</svg>
